name: semantic-release

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  packages: write

jobs:
  semantic:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      CI: true
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build --if-present
      - run: previousVersion=$(sed 's/.*"version"&#58; "\(.*\)".*/\1/;t;d' ./package.json)
      - run: |
          # Install semantic-release and common plugins locally (no-global) so the pipeline can run reliably.
          npm install --no-audit --no-fund --no-save \
            @semantic-release/changelog \
            @semantic-release/commit-analyzer \
            @semantic-release/git \
            @semantic-release/github \
            @semantic-release/exec \
            @semantic-release/npm@^13 \
            @semantic-release/release-notes-generator \
            semantic-release@^25
        env:
          HUSKY: 0
          CI: true
      - run: |
          # Run semantic-release using the locally installed packages
          npx semantic-release --ci
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: 00000000-0000-0000-0000-000000000000 # Placeholder para ativar o plugin
          NPM_CONFIG_PROVENANCE: true # Habilita o vínculo OIDC/Provenance
          HUSKY: 0
          CI: true
      - run: finalVersion=$(sed 's/.*"version"&#58; "\(.*\)".*/\1/;t;d' ./package.json)
      - run: |
          if [ "$previousVersion" != "$finalVersion" ]; then
            git push
          fi